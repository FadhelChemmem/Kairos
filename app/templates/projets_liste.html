{% extends "base.html" %}
{% import "partials/avatar.html" as avatarm %}
{% block title %}Tous les projets — Kairos{% endblock %}
{% block body %}
<div class="page-wrap" style="padding-top:24px; padding-bottom:60px;">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
    <span style="font-size:18px; font-weight:800;">Tous les projets</span>
    <a href="{{ url_for('projets.creer') }}" class="btn-secondary" style="width:auto; padding:9px 16px; text-decoration:none;">+ Nouveau projet</a>
  </div>

  <form method="get" id="filtres-projets">
    <input type="hidden" name="filtres_actifs" value="1">
    <div class="search-mini" style="margin-bottom:12px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b968f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" name="q" value="{{ q }}" placeholder="Rechercher un projet (code ou nom)…" style="flex:1; border:none; outline:none; background:none; font-size:13.5px; font-family:inherit;">
    </div>

    <div class="card" style="padding:14px 18px; margin-bottom:14px; display:flex; flex-direction:column; gap:12px;">
      <div>
        <div style="font-size:11px; font-weight:700; color:#9aa39c; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px;">État</div>
        <select name="etat" multiple data-chip-select>
          <option value="en_cours" {{ 'selected' if 'en_cours' in etats }}>En cours</option>
          <option value="bloque" {{ 'selected' if 'bloque' in etats }}>Bloqué</option>
          <option value="termine" {{ 'selected' if 'termine' in etats }}>Terminé</option>
          <option value="abandonne" {{ 'selected' if 'abandonne' in etats }}>Abandonné</option>
        </select>
      </div>
      <div>
        <div style="font-size:11px; font-weight:700; color:#9aa39c; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px;">Phase</div>
        <select name="phase" multiple data-chip-select>
          {% for ph in phases_choices %}
            <option value="{{ ph }}" {{ 'selected' if ph in phases }}>{{ ph }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <div style="font-size:11px; font-weight:700; color:#9aa39c; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px;">Lots</div>
        <select name="lot" multiple data-chip-select>
          <option value="CM" {{ 'selected' if 'CM' in lots }}>CM — Charpente Métallique</option>
          <option value="GO" {{ 'selected' if 'GO' in lots }}>GO — Gros Œuvre</option>
        </select>
      </div>
      <div>
        <div style="font-size:11px; font-weight:700; color:#9aa39c; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px;">Chef de projet</div>
        <select name="chef_id" multiple data-chip-select data-chip-filter="1" data-chip-filter-placeholder="Rechercher une personne…">
          {% for u in utilisateurs_actifs %}
            <option value="{{ u.id }}" {{ 'selected' if u.id in chef_ids }}>{{ u.prenom }} {{ u.nom }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </form>

  <div id="projets-resultats">
    {% include "partials/projets_tableau.html" %}
  </div>
</div>
<script>
// Recherche + filtres à puces (retour Fadhel, 2026-09-27) : ne rafraîchit
// plus que le bloc #projets-resultats (compteur + tableau) via une requête
// AJAX vers cette même route (voir la branche X-Requested-With côté
// routes/projets.liste), sans recharger toute la page ni exiger d'appuyer
// sur Entrée. data-chip-autosubmit a été retiré des <select> ci-dessus :
// chip-select.js se contente de déclencher un évènement "change" sur le
// <select>, qu'on écoute ici pour lancer le rafraîchissement nous-mêmes.
(function () {
  var form = document.getElementById('filtres-projets');
  var input = form.querySelector('input[name="q"]');
  var resultats = document.getElementById('projets-resultats');
  var timer = null;

  function refresh() {
    var params = new URLSearchParams(new FormData(form));
    var url = window.location.pathname + '?' + params.toString();
    fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(function (r) { return r.text(); })
      .then(function (html) {
        resultats.innerHTML = html;
        window.history.replaceState(null, '', url);
      })
      .catch(function () { form.submit(); });
  }

  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(refresh, 250);
  });

  form.addEventListener('change', function (e) {
    if (e.target.matches && e.target.matches('select[data-chip-select]')) {
      refresh();
    }
  });
})();
</script>
{% endblock %}
