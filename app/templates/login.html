{% extends "base.html" %}
{% block title %}Connexion — Kairos{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-blob login-blob-a"></div>
  <div class="login-blob login-blob-b"></div>

  <form method="post" class="card login-card">
    <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:32px;">
      <img src="{{ url_for('static', filename='img/kairos-logo.png') }}" alt="Kairos" style="height:40px; width:auto; display:block; margin-bottom:4px;">
    </div>

    <div class="form-row" style="margin-bottom:16px;">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email" placeholder="vous@exemple.com" value="{{ request.form.email or '' }}" required autofocus>
    </div>
    <div class="form-row" style="margin-bottom:10px;">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" placeholder="••••••••••" required>
    </div>

    <div style="display:flex; justify-content:flex-end; margin-bottom:22px;">
      <a class="forgot-link" href="{{ url_for('auth.mot_de_passe_oublie') }}">Mot de passe oublié ?</a>
    </div>

    <button type="submit" class="btn-login">Se connecter</button>
  </form>
</div>
{% endblock %}
