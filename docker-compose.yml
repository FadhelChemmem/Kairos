version: "3.9"

# Déploiement LAN-first : deux services, pas de dépendance internet une
# fois les images construites. Les données Postgres vivent dans un
# volume nommé (persistant entre redémarrages / mises à jour de l'appli).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      # Fuseau horaire (PROMPT_CORRECTIONS.md P2 #16) : sans ça, l'image
      # postgres:16 tourne en UTC — `now()`/`CURRENT_DATE` (date de clôture
      # d'une tâche, DailyLog...) ne correspondent alors plus à "aujourd'hui"
      # en Tunisie entre 00h et 01h (UTC+1, pas d'heure d'été). L'image
      # officielle applique TZ au fuseau système ET à la valeur par défaut
      # du paramètre Postgres `timezone` ; PGTZ le fixe aussi côté client
      # libpq, en ceinture et bretelles.
      TZ: Africa/Tunis
      PGTZ: Africa/Tunis
    volumes:
      - kairos_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Loopback UNIQUEMENT (revue sécurité, PROMPT_CORRECTIONS.md P0 #6) :
      # "5432:5432" exposait Postgres à TOUT le LAN, sans lien avec le
      # besoin réel (le service web s'y connecte via le réseau Docker
      # interne, pas par ce port publié). "127.0.0.1:5432:5432" ne le rend
      # joignable que depuis la machine qui héberge le conteneur — pour s'y
      # connecter avec un client SQL depuis un AUTRE poste du LAN, passer
      # par un tunnel SSH plutôt que de rouvrir ce port en grand.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kairos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kairos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kairos}
      SECRET_KEY: ${SECRET_KEY:?définir SECRET_KEY dans .env}
      FLASK_ENV: ${FLASK_ENV:-production}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Fuseau horaire (PROMPT_CORRECTIONS.md P2 #16) : sans ça, le
      # conteneur (Debian slim) tourne en UTC — `datetime.date.today()`
      # (utilisé partout : DailyLog, deadlines, verrouillage du jour...)
      # renvoie encore "hier" en Tunisie entre 00h et 01h.
      TZ: Africa/Tunis
      # Envoi d'email (mot de passe oublié / création de compte) — voir
      # .env.example. Vides par défaut : ces fonctionnalités restent
      # inactives (sans planter) tant que SMTP_HOST n'est pas renseigné.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    ports:
      - "8000:8000"
    volumes:
      # Pièces jointes (tâches/posts) stockées sur disque local, en dehors
      # du conteneur applicatif, pour survivre aux mises à jour de l'image.
      - kairos_uploads:/app/uploads

# Noms explicites (`name:`) pour que le volume final s'appelle exactement
# "kairos_pgdata"/"kairos_uploads" sur le disque, sans préfixe du nom de
# projet Compose (qui varie selon le dossier d'installation) — utile pour
# que la commande de migration donnée dans le README (renommage
# workflowbook → Kairos, 2026-09-21) reste valable telle quelle.
volumes:
  kairos_pgdata:
    name: kairos_pgdata
  kairos_uploads:
    name: kairos_uploads
