# Déploiement LAN-first : deux services, pas de dépendance internet une
# fois les images construites. Les données Postgres vivent dans un
# volume nommé (persistant entre redémarrages / mises à jour de l'appli).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      # Fuseau horaire (PROMPT_CORRECTIONS.md P2 #16) : sans ça, l'image
      # postgres:16 tourne en UTC — `now()`/`CURRENT_DATE` (date de clôture
      # d'une tâche, DailyLog...) ne correspondent alors plus à "aujourd'hui"
      # en Tunisie entre 00h et 01h (UTC+1, pas d'heure d'été). L'image
      # officielle applique TZ au fuseau système ET à la valeur par défaut
      # du paramètre Postgres `timezone` ; PGTZ le fixe aussi côté client
      # libpq, en ceinture et bretelles.
      TZ: Africa/Tunis
      PGTZ: Africa/Tunis
    volumes:
      - kairos_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Loopback UNIQUEMENT (revue sécurité, PROMPT_CORRECTIONS.md P0 #6) :
      # "5432:5432" exposait Postgres à TOUT le LAN, sans lien avec le
      # besoin réel (le service web s'y connecte via le réseau Docker
      # interne, pas par ce port publié). "127.0.0.1:5432:5432" ne le rend
      # joignable que depuis la machine qui héberge le conteneur — pour s'y
      # connecter avec un client SQL depuis un AUTRE poste du LAN, passer
      # par un tunnel SSH plutôt que de rouvrir ce port en grand.
      - "127.0.0.1:5432:5432"
    # Via TCP (-h 127.0.0.1) et non le socket Unix (audit n°2) : au tout
    # premier démarrage, le serveur temporaire qui applique schema.sql
    # n'écoute que sur le socket — pg_isready répondait "prêt" trop tôt et
    # `web` démarrait avant la fin de l'initialisation.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-kairos} -d ${POSTGRES_DB:-kairos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: &journaux
      # Rotation des journaux Docker (audit n°2) : sans limite, ils
      # grossissaient indéfiniment sur le disque du NAS.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Sauvegarde automatique avant migration (audit QA du lot 10) : `web`
  # applique les migrations à son démarrage (CMD du Dockerfile) ; ce service
  # ponctuel passe juste avant et sauvegarde la base si une migration est en
  # attente (scripts/sauvegarde_avant_migration.sh, pg_dump de l'image
  # postgres:16, donc de la même version que le serveur). S'il échoue,
  # `web` ne démarre pas et rien n'est migré. Fichiers dans
  # ${KAIROS_BACKUP_DIR:-./backups}/avant_migration_*.sql.gz.
  sauvegarde-migrations:
    image: postgres:16
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/sauvegarde_avant_migration.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-kairos}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-kairos}
      TZ: Africa/Tunis
      PGTZ: Africa/Tunis
    volumes:
      - ./scripts/sauvegarde_avant_migration.sh:/sauvegarde_avant_migration.sh:ro
      - ./migrations:/migrations:ro
      - ${KAIROS_BACKUP_DIR:-./backups}:/sauvegardes
    logging: *journaux

  web:
    build: .
    restart: unless-stopped
    # Durcissement (audit QA m8) : aucun privilège supplémentaire possible,
    # aucune capacité Linux (gunicorn écoute sur 8000, en appuser), et le
    # temps de finir les requêtes en cours à l'arrêt.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      sauvegarde-migrations:
        condition: service_completed_successfully
    environment:
      # Mot de passe passé à part (PGPASSWORD, lu par libpq) plutôt que dans
      # l'URL (audit n°2) : un mot de passe contenant @, /, : ou % cassait
      # l'URL et le conteneur web redémarrait en boucle.
      DATABASE_URL: postgresql://${POSTGRES_USER:-kairos}@db:5432/${POSTGRES_DB:-kairos}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?définir SECRET_KEY dans .env}
      FLASK_ENV: ${FLASK_ENV:-production}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      # Adresses (IP ou CIDR, séparées par des virgules) d'où les en-têtes
      # X-Forwarded-* sont crus : celle du reverse proxy telle que vue par
      # l'appli. Vide : réseaux Docker 172.16.0.0/12 + 127.0.0.1 + HOST_IP
      # (avertissement au démarrage si le port 8000 est publié sur le LAN).
      # Une requête d'une autre adresse portant ces en-têtes est signalée
      # dans `docker compose logs web`, avec l'IP vue (app/proxy.py).
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      HOST_IP: ${HOST_IP:-}
      # Transmis à l'appli : avec TRUSTED_PROXY_COUNT > 0, TRUSTED_PROXY_IPS
      # vide et le port publié sur le LAN, elle prévient au démarrage.
      WEB_BIND: ${WEB_BIND:-0.0.0.0}
      SESSION_DUREE_ABSOLUE_JOURS: ${SESSION_DUREE_ABSOLUE_JOURS:-30}
      # Compression gzip par l'appli ; false si le proxy compresse déjà.
      COMPRESSION_GZIP: ${COMPRESSION_GZIP:-true}
      # Fuseau horaire (PROMPT_CORRECTIONS.md P2 #16) : sans ça, le
      # conteneur (Debian slim) tourne en UTC — `datetime.date.today()`
      # (utilisé partout : DailyLog, deadlines, verrouillage du jour...)
      # renvoie encore "hier" en Tunisie entre 00h et 01h.
      TZ: Africa/Tunis
      # Fuseau des sessions PostgreSQL ouvertes par l'appli (lu par libpq) —
      # PGTZ sur le service `db` ne s'applique qu'à psql DANS ce conteneur.
      PGTZ: Africa/Tunis
      # Envoi d'email (mot de passe oublié / création de compte) — voir
      # .env.example. Vides par défaut : ces fonctionnalités restent
      # inactives (sans planter) tant que SMTP_HOST n'est pas renseigné.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      # Mode test des e-mails : seules ces adresses / @domaines reçoivent
      # un e-mail ; vide = aucun filtre (voir .env.example, app/mailer.py).
      MAIL_DESTINATAIRES_AUTORISES: ${MAIL_DESTINATAIRES_AUTORISES:-}
      # Mode test de Kairos (lot 12) : true = « Agir comme » et date
      # simulée pour les Admins ; false par défaut (voir .env.example et la
      # section « Mode test » du README). À couper avant la mise en service.
      KAIROS_MODE_TEST: ${KAIROS_MODE_TEST:-false}
    ports:
      # WEB_BIND=127.0.0.1 quand le reverse proxy HTTPS tourne sur la même
      # machine HORS conteneur : sinon le port 8000 reste joignable en HTTP
      # simple depuis le LAN, en contournant le proxy (audit n°2). Un proxy
      # en conteneur qui vise l'IP LAN du serveur garde WEB_BIND=0.0.0.0 :
      # les en-têtes d'un poste du LAN sont alors ignorés (TRUSTED_PROXY_IPS).
      # Par défaut, accès direct depuis le LAN.
      - "${WEB_BIND:-0.0.0.0}:8000:8000"
    healthcheck:
      # Pas de curl dans l'image : Python fait la requête. Lot 20 : /sante
      # interroge la base (/connexion répondait 200 base arrêtée).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sante', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *journaux
    volumes:
      # Pièces jointes (tâches/posts) stockées sur disque local, en dehors
      # du conteneur applicatif, pour survivre aux mises à jour de l'image.
      - kairos_uploads:/app/uploads

# Noms explicites (`name:`) pour que le volume final s'appelle exactement
# "kairos_pgdata"/"kairos_uploads" sur le disque, sans préfixe du nom de
# projet Compose (qui varie selon le dossier d'installation) — utile pour
# que la commande de migration donnée dans le README (renommage
# workflowbook → Kairos, 2026-09-21) reste valable telle quelle.
volumes:
  kairos_pgdata:
    name: kairos_pgdata
  kairos_uploads:
    name: kairos_uploads
